services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: myhome
      POSTGRES_PASSWORD: myhome
      POSTGRES_DB: myhome
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U myhome -d myhome']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
