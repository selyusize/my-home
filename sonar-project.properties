sonar.projectKey=my-home
sonar.projectName=my-home
sonar.projectVersion=0.0.0
sonar.host.url=http://localhost:9000
sonar.sourceEncoding=UTF-8

# Sources: Go packages + frontend
sonar.sources=main.go,pkg,internal,frontend/src
sonar.tests=pkg,internal
sonar.test.inclusions=**/*_test.go

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/bindings/**,\
  **/*.d.ts,\
  **/shared/ui/**,\
  **/vendor/**,\
  **/bin/**,\
  **/build/**,\
  **/.scannerwork/**,\
  **/.sonar/**,\
  **/coverage.out,\
  **/testdata/**

sonar.test.exclusions=\
  **/vendor/**,\
  **/bin/**,\
  **/build/**

# Go coverage (generated by `make sonar-coverage`)
sonar.go.coverage.reportPaths=coverage.out
